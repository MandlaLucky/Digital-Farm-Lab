name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: digital-farm-lab-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Make gradlew executable
        run: chmod +x gradlew
      - name: Run ScenarioEngineTest (12 tests)
        run: ./gradlew test --tests "com.mlm.digitalfarm.service.ScenarioEngineTest" --no-daemon
      - name: Assemble (skip tests)
        run: ./gradlew assemble -x test --no-daemon