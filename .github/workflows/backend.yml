name: Backend CI

on:
  push:
    branches: [main, feat/trainer-ui]
  pull_request:
    branches: [main, feat/trainer-ui]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: digital-farm-lab-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Grant gradlew
        run: chmod +x gradlew
      - name: Unit tests (12)
        run: ./gradlew test --no-daemon --console=plain
      - name: Assemble
        run: ./gradlew assemble -x test --no-daemon --console=plain