name: Frontend CI

on:
  push:
    branches: [main, feat/trainer-ui]
  pull_request:
    branches: [main, feat/trainer-ui]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: digital-farm-lab-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: digital-farm-lab-frontend/package-lock.json
      - name: npm ci
        run: npm ci --no-audit --no-fund
      - name: build (tsc + vite + PWA)
        run: npm run build