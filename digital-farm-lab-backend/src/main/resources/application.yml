spring:
  application:
    name: digitalfarms
  profiles:
    default: dev              # local boot works out of the box
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true

security:
  jwt:
    jwk-set-uri: ${JWT_JWK_SET_URI:}    # real IdP JWKS (production)
    issuer-uri:  ${JWT_ISSUER_URI:}     # OIDC discovery (staging/production)
    secret:      ${JWT_SECRET:}         # HS256 shared secret (dev only — set by dev profile)
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

agriconnect:
  passport:
    base-url: ${AGRICONNECT_PASSPORT_BASE_URL:http://localhost:8081}
  learn:
    base-url: ${AGRICONNECT_LEARN_BASE_URL:http://localhost:8082}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info