server:
  port: ${port: ${PORT:8081}}

# Docker profile — activated via SPRING_PROFILES_ACTIVE=docker.
# All values come from environment variables (set by docker-compose).
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/digitalfarm_DB}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:123456}
  jpa:
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true

security:
  jwt:
    secret: ${JWT_SECRET:dev-only-do-not-deploy-please-change-this-secret-2026}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost,http://localhost:80}

logging:
  level:
    com.mlm.digitalfarm: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info