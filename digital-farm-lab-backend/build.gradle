plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.MLM'
version = '0.0.1-SNAPSHOT'
description = 'DigitalFarm — A14 AgriConnect 360 capstone'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {

    // ── Web / REST ────────────────────────────────────────────────
    // Boot 4: spring-boot-starter-web is deprecated → webmvc
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // ── Persistence ───────────────────────────────────────────────
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly   'org.postgresql:postgresql'

    // ── Flyway ────────────────────────────────────────────────────
    // Boot 4: autoconfiguration moved to its own starter
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    runtimeOnly   'org.flywaydb:flyway-database-postgresql'

    // ── Security / JWT resource server ────────────────────────────
    implementation 'org.springframework.boot:spring-boot-starter-security'
    // Boot 4: old oauth2-resource-server starter is deprecated
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'

    // ── Operations ────────────────────────────────────────────────
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // ── OpenAPI / Swagger UI ─────────────────────────────────────
    // springdoc v3.2.0 is built against Boot 4.1.2
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.2.0'

    // ── Testing ───────────────────────────────────────────────────
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // Boot 4 modular test starters — each is needed for its slice:
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'

    // Testcontainers (PostgreSQL for integration tests)
    testImplementation 'org.testcontainers:postgresql:1.20.4'
    testImplementation 'org.testcontainers:junit-jupiter:1.20.4'

    // WireMock for mocking upstream HTTP integrations
    testImplementation 'org.wiremock:wiremock-standalone:3.9.1'

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    // Optional but recommended for the demo: show test progress in CI
    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "short"
    }
}